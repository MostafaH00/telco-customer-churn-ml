name: CI/CD - Telco Customer Churn

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: telco-churn-${{ github.ref }}
  cancel-in-progress: false
  
jobs:
  tests:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prod.txt
          python -m pip install pytest httpx
          python -m pip check

      - name: Run pytest
        run: python -m pytest -q tests/

 
  docker-build:
    name: Build and Publish Docker Image
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/mostafah00/telco-customer-churn-ml:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/MostafaH00/telco-customer-churn-ml
    
  deploy:
    name: Deploy to Azure Container Apps
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Docker image
        run: |
          az containerapp update \
            --name telco-churn-app \
            --resource-group rg-telco-churn \
            --container-name telco-churn-app \
            --image ghcr.io/mostafah00/telco-customer-churn-ml:sha-${{ github.sha }} \
            --min-replicas 0 \
            --max-replicas 1
            
      - name: Verify deployment health
        run: |
          EXPECTED_IMAGE="ghcr.io/mostafah00/telco-customer-churn-ml:sha-${{ github.sha }}"
          HEALTH_URL="https://telco-churn-app.nicehill-20e3b8d0.francecentral.azurecontainerapps.io/health"

          for attempt in {1..20}; do
            echo "Health check attempt $attempt/20"

            IMAGE=$(az containerapp show \
              --name telco-churn-app \
              --resource-group rg-telco-churn \
              --query "properties.template.containers[?name=='telco-churn-app'].image | [0]" \
              -o tsv)

            echo "Expected image: $EXPECTED_IMAGE"
            echo "Configured image: $IMAGE"

            if [ "$IMAGE" = "$EXPECTED_IMAGE" ]; then
              if RESPONSE=$(curl --fail --silent --show-error \
                --max-time 60 "$HEALTH_URL"); then

                echo "Health response: $RESPONSE"

                if echo "$RESPONSE" | jq -e \
                  '.status == "healthy" and .model_loaded == true'; then
                  echo "Deployment health verification passed."
                  exit 0
                fi
              fi
            fi

            sleep 15
          done

          echo "Deployment health verification failed."
          exit 1